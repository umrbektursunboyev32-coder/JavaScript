<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waze o'yini</title>
  <style>
    body {
      margin: 0;
      background: #87ceeb;
      overflow: hidden;
      font-family: sans-serif;
      text-align: center;
    }
    h1 {
      color: white;
      text-shadow: 2px 2px 5px #000;
    }
    #gameArea {
      position: relative;
      width: 400px;
      height: 600px;
      margin: 20px auto;
      background: #333;
      overflow: hidden;
      border-radius: 10px;
      border: 4px solid #111;
    }
    .roadLine {
      position: absolute;
      width: 10px;
      height: 80px;
      background: white;
      left: 195px;
    }
    .car {
      position: absolute;
      width: 50px;
      height: 100px;
      bottom: 20px;
      background: red;
      border-radius: 10px;
    }
    .enemy {
      position: absolute;
      width: 50px;
      height: 100px;
      background: yellow;
      border-radius: 10px;
    }
    #score {
      color: white;
      font-size: 24px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>🚗 Waze o'yini</h1>
  <div id="score">Ball: 0</div>
  <div id="gameArea"></div>

  <script>
    const gameArea = document.getElementById('gameArea');
    const scoreDisplay = document.getElementById('score');

    let player = { speed: 5, score: 0, inPlay: false };
    let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

    document.addEventListener('keydown', pressOn);
    document.addEventListener('keyup', pressOff);

    function pressOn(e) { e.preventDefault(); keys[e.key] = true; }
    function pressOff(e) { e.preventDefault(); keys[e.key] = false; }

    function startGame() {
      gameArea.innerHTML = '';
      player.inPlay = true;
      player.score = 0;

      for (let x = 0; x < 5; x++) {
        let roadLine = document.createElement('div');
        roadLine.setAttribute('class', 'roadLine');
        roadLine.y = x * 150;
        roadLine.style.top = roadLine.y + 'px';
        gameArea.appendChild(roadLine);
      }

      let car = document.createElement('div');
      car.setAttribute('class', 'car');
      gameArea.appendChild(car);
      player.x = car.offsetLeft;
      player.y = car.offsetTop;

      for (let i = 0; i < 3; i++) {
        let enemy = document.createElement('div');
        enemy.setAttribute('class', 'enemy');
        enemy.y = ((i + 1) * 300) * -1;
        enemy.style.left = Math.floor(Math.random() * 350) + 'px';
        enemy.style.top = enemy.y + 'px';
        gameArea.appendChild(enemy);
      }

      window.requestAnimationFrame(playGame);
    }

    function playGame() {
      let car = document.querySelector('.car');
      let road = gameArea.getBoundingClientRect();

      if (!player.inPlay) return;

      moveLines();
      moveEnemies(car);

      if (keys.ArrowUp && player.y > 0) player.y -= player.speed;
      if (keys.ArrowDown && player.y < (road.height - 100)) player.y += player.speed;
      if (keys.ArrowLeft && player.x > 0) player.x -= player.speed;
      if (keys.ArrowRight && player.x < (road.width - 50)) player.x += player.speed;

      car.style.top = player.y + 'px';
      car.style.left = player.x + 'px';

      player.score++;
      scoreDisplay.textContent = "Ball: " + player.score;
      window.requestAnimationFrame(playGame);
    }

    function moveLines() {
      let lines = document.querySelectorAll('.roadLine');
      lines.forEach(line => {
        line.y += player.speed;
        if (line.y > 600) line.y -= 750;
        line.style.top = line.y + 'px';
      });
    }

    function moveEnemies(car) {
      let enemies = document.querySelectorAll('.enemy');
      enemies.forEach(enemy => {
        if (isCollide(car, enemy)) {
          player.inPlay = false;
          alert('💥 To‘qnashdingiz! Ball: ' + player.score);
        }
        enemy.y += player.speed;
        if (enemy.y > 600) {
          enemy.y = -200;
          enemy.style.left = Math.floor(Math.random() * 350) + 'px';
        }
        enemy.style.top = enemy.y + 'px';
      });
    }

    function isCollide(a, b) {
      let aRect = a.getBoundingClientRect();
      let bRect = b.getBoundingClientRect();
      return !(
        aRect.bottom < bRect.top ||
        aRect.top > bRect.bottom ||
        aRect.right < bRect.left ||
        aRect.left > bRect.right
      );
    }

    // Boshlanish
    startGame();
  </script>
</body>
</html>
